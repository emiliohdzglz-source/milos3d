<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu cotización — MILO'S 3D</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04060e">
<link rel="icon" href="assets/logo.webp" type="image/webp">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060e; --panel:#0e1730; --panel-2:#131f3d;
  --border:rgba(90,160,255,.2); --cyan:#4cc9ff; --blue:#2f7bff;
  --text:#e8eefc; --dim:#9fb0d0; --ok:#3ddc97;
  --font-display:'Orbitron',sans-serif; --font-body:'Rajdhani',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:radial-gradient(120% 70% at 50% 0%,#0b1428,#04060e 60%) fixed;
  color:var(--text);font-family:var(--font-body);font-size:17px;line-height:1.5;
  min-height:100vh;padding:0 16px 48px;
}
.wrap{max-width:560px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
.logo{width:110px}
h1{font-family:var(--font-display);font-size:22px;margin-top:14px}
h1 em{font-style:normal;color:var(--cyan)}
.folio{color:var(--dim);font-size:14px;letter-spacing:1.5px;text-transform:uppercase;margin-top:6px}
.card{
  background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px;
}
.card h2{font-family:var(--font-display);font-size:13px;color:var(--cyan);
  text-transform:uppercase;letter-spacing:1.2px;margin-bottom:14px}
.line{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border)}
.line:last-child{border-bottom:none}
.line img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
.line-body{flex:1;min-width:0}
.line-name{font-weight:700}
.line-note{color:var(--dim);font-size:14px}
.line-amt{font-family:var(--font-display);font-size:16px;white-space:nowrap}
.row{display:flex;justify-content:space-between;padding:7px 0;color:var(--dim)}
.row b{color:var(--text)}
.row.total{border-top:1px solid var(--border);margin-top:8px;padding-top:14px;
  font-family:var(--font-display);font-size:20px;color:var(--text)}
.row.total b{color:var(--cyan);font-size:26px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  font-family:var(--font-body);font-size:17px;font-weight:700;
  padding:15px;border-radius:13px;border:1px solid var(--border);
  background:rgba(76,201,255,.06);color:var(--text);
  text-decoration:none;margin-top:11px;cursor:pointer;
}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#041020;border-color:transparent}
.nota{color:var(--dim);font-size:15px;white-space:pre-wrap}
.pago{white-space:pre-wrap;font-size:15px;background:rgba(4,8,20,.5);
  border:1px solid var(--border);border-radius:11px;padding:12px;margin-top:10px}
footer{text-align:center;color:var(--dim);font-size:14px;margin-top:26px}
footer a{color:var(--cyan);text-decoration:none}
.err{text-align:center;padding:60px 20px;color:var(--dim)}
.btn:disabled{opacity:.6;cursor:default}
.btn .sp{width:17px;height:17px;border-radius:50%;border:2px solid rgba(4,16,32,.3);
  border-top-color:#041020;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.pay-err{color:#ff8a94;font-size:15px;margin-top:10px;text-align:center}
.metodos{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.metodos span{font-size:12px;color:var(--dim);border:1px solid var(--border);
  border-radius:999px;padding:3px 10px}
.estado{text-align:center;padding:50px 20px}
.estado .ico{font-size:56px;display:block;margin-bottom:16px}
.estado h1{font-size:23px;margin-bottom:12px}
.estado p{color:var(--dim);margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="err">Cargando cotización…</div>
</div>

<script>
const $ = s => document.querySelector(s);
const money = n => "$" + Math.round(n).toLocaleString("es-MX") + " MXN";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function b64urlDec(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

function render(q){
  const sub = q.i.reduce((s,x) => s + x.p * x.q, 0);
  const total = sub + (q.e || 0) - (q.x || 0);
  const anticipo = q.a ? Math.round(total * q.a / 100) : 0;

  const msg = `¡Hola MILO'S 3D! Apruebo la cotización #${q.f} por ${money(total)}. ` +
              `Mi nombre es ${q.c || "___"}.`;
  const wa = `https://wa.me/${q.w || ""}?text=${encodeURIComponent(msg)}`;

  $("#wrap").innerHTML = `
    <header>
      <img class="logo" src="assets/logo.webp" alt="MILO'S 3D" onerror="this.style.display='none'">
      <h1>MILO'S <em>3D</em></h1>
      <div class="folio">Cotización #${esc(q.f)}${q.c ? " · " + esc(q.c) : ""}</div>
    </header>

    <div class="card">
      <h2>Tu pedido</h2>
      ${q.i.map(x => `
        <div class="line">
          ${x.im ? `<img src="${esc(x.im)}" alt="" onerror="this.remove()">` : ""}
          <div class="line-body">
            <div class="line-name">${x.q}× ${esc(x.n)}</div>
            ${x.d ? `<div class="line-note">${esc(x.d)}</div>` : ""}
          </div>
          <div class="line-amt">${money(x.p * x.q)}</div>
        </div>`).join("")}
      <div class="row"><span>Subtotal</span><b>${money(sub)}</b></div>
      ${q.e ? `<div class="row"><span>Envío</span><b>${money(q.e)}</b></div>` : ""}
      ${q.x ? `<div class="row"><span>Descuento</span><b>−${money(q.x)}</b></div>` : ""}
      <div class="row total"><span>Total</span><b>${money(total)}</b></div>
    </div>

    ${q.t ? `<div class="card"><h2>Notas</h2><div class="nota">${esc(q.t)}</div></div>` : ""}

    <div class="card">
      <h2>¿Cómo pagar?</h2>
      ${anticipo ? `<p class="nota">Para arrancar la impresión pedimos un anticipo de <b style="color:var(--cyan)">${money(anticipo)}</b> (${q.a}%) y el resto al entregar.</p>` : ""}

      ${q.pg ? `
        ${anticipo ? `
          <button class="btn btn-primary" data-pagar="${anticipo}">💳 Pagar anticipo · ${money(anticipo)}</button>
          <button class="btn" data-pagar="0">Pagar todo · ${money(total)}</button>` : `
          <button class="btn btn-primary" data-pagar="0">💳 Pagar con tarjeta · ${money(total)}</button>`}
        <div class="metodos"><span>Tarjeta</span><span>Débito</span><span>OXXO</span><span>Mercado Pago</span></div>
        <div class="pay-err" id="pay-err" hidden></div>
      ` : q.lp ? `
        <a class="btn btn-primary" href="${esc(q.lp)}" target="_blank" rel="noopener">💳 Pagar en línea</a>
      ` : ""}

      ${q.dp ? `<div class="pago">${esc(q.dp)}</div>` : ""}
      ${!q.pg && !q.lp && !q.dp ? `<p class="nota">Te pasamos los datos de pago por WhatsApp al aprobar.</p>` : ""}
    </div>

    <a class="btn btn-primary" href="${wa}" target="_blank" rel="noopener">✅ Aprobar por WhatsApp</a>
    <a class="btn" href="https://wa.me/${q.w || ""}?text=${encodeURIComponent(`Hola, tengo una duda sobre la cotización #${q.f}`)}" target="_blank" rel="noopener">💬 Tengo una duda</a>

    <footer>
      <a href="/">milos3d.com</a> · Impresión 3D en Querétaro<br>
      Precios en pesos mexicanos. Vigencia: 15 días.
    </footer>`;

  document.querySelectorAll("[data-pagar]").forEach(b =>
    b.addEventListener("click", () => pagar(b, q, +b.dataset.pagar)));
}

/* ---------- Cobro con tarjeta (Mercado Pago) ---------- */
async function pagar(boton, q, anticipo) {
  const err = $("#pay-err");
  const original = boton.innerHTML;
  document.querySelectorAll("[data-pagar]").forEach(b => b.disabled = true);
  boton.innerHTML = '<span class="sp"></span> Conectando…';
  err.hidden = true;

  try {
    const r = await fetch(q.pg.replace(/\/+$/, "") + "/preferencia", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        folio: q.f, cliente: q.c, items: q.i,
        envio: q.e || 0, descuento: q.x || 0,
        anticipo: anticipo || 0
      })
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || !data.url) throw new Error(data.error || "No se pudo abrir el pago.");
    location.href = data.url;
    return;
  } catch (e) {
    err.textContent = e.message + " Si sigue fallando, escríbenos por WhatsApp y lo resolvemos.";
    err.hidden = false;
  }
  document.querySelectorAll("[data-pagar]").forEach(b => b.disabled = false);
  boton.innerHTML = original;
}

/* ---------- Regreso desde Mercado Pago ---------- */
function estadoPago(tipo, folio) {
  const vistas = {
    exito: ["🎉", "¡Pago recibido!", "Ya nos llegó tu pago. Empezamos a imprimir y te avisamos por WhatsApp en cuanto esté listo."],
    pendiente: ["⏳", "Pago en proceso", "Mercado Pago está confirmando tu pago. Cuando se acredite te avisamos por WhatsApp — si pagaste en OXXO puede tardar unas horas."],
    error: ["😕", "No se completó el pago", "No se hizo ningún cargo. Puedes intentar de nuevo o pagar por transferencia; escríbenos y te ayudamos."]
  };
  const [ico, titulo, texto] = vistas[tipo] || vistas.pendiente;
  $("#wrap").innerHTML = `
    <div class="estado">
      <img class="logo" src="assets/logo.webp" alt="MILO'S 3D" onerror="this.style.display='none'">
      <span class="ico">${ico}</span>
      <h1>${titulo}</h1>
      <p>${texto}</p>
      ${folio ? `<p class="folio">Cotización #${esc(folio)}</p>` : ""}
      <a class="btn btn-primary" href="https://wa.me/524427831563" target="_blank" rel="noopener" style="max-width:320px;margin:24px auto 0">💬 Escribirnos por WhatsApp</a>
      <p style="margin-top:22px"><a href="/" style="color:#4cc9ff;text-decoration:none">Ir a milos3d.com</a></p>
    </div>`;
}

const params = new URLSearchParams(location.search);

// Si cambia la liga sin recargar (raro, pero pasa al compartir), repinta.
addEventListener("hashchange", () => location.reload());

try {
  if (params.get("pago")) {
    estadoPago(params.get("pago"), params.get("folio"));
  } else {
    const m = location.hash.match(/q=([^&]+)/);
    if (!m) throw new Error("sin datos");
    render(JSON.parse(b64urlDec(m[1])));
  }
} catch (e) {
  $("#wrap").innerHTML = `<div class="err">
    <h1 style="font-family:Orbitron,sans-serif;font-size:20px;margin-bottom:10px">Cotización no encontrada</h1>
    <p>La liga está incompleta. Pídenos que te la mandemos de nuevo por WhatsApp.</p>
    <p style="margin-top:20px"><a href="/" style="color:#4cc9ff">Ir a milos3d.com</a></p>
  </div>`;
}
</script>
</body>
</html>
