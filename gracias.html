<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gracias por tu compra — MILO'S 3D</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.png" type="image/png">
  <style>
    /* Página de una sola cosa: decirle al cliente qué pasó con su pago
       y dejarle un camino claro para hablar con nosotros. Autosuficiente,
       con la piel de la casa nueva (crema, tinta, Inter y pastillas). */
    :root {
      --fundo: #f2efe9; --tinta: #16131f; --apagado: #5c5a64;
      --linea: rgba(22, 19, 31, 0.14); --pop: #ffd43b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--fundo); color: var(--tinta);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-optical-sizing: auto; -webkit-font-smoothing: antialiased;
    }
    .gr-wrap {
      min-height: 100svh; display: flex; align-items: center; justify-content: center;
      padding: 28px 20px;
    }
    .gr-card {
      width: 100%; max-width: 440px; text-align: center;
      background: #fff; border: 1px solid var(--linea);
      border-radius: 20px; padding: 34px 26px;
      box-shadow: 0 24px 70px rgba(22, 19, 31, 0.14);
    }
    .gr-logo { width: 150px; margin: 0 auto 6px; display: block; filter: drop-shadow(0 10px 24px rgba(22, 19, 31, 0.16)); }
    .gr-icono { font-size: 46px; line-height: 1; margin-bottom: 10px; }
    .gr-card h1 { font-size: 24px; font-weight: 850; letter-spacing: -0.02em; margin: 0 0 10px; }
    .gr-card p { font-size: 15.5px; line-height: 1.5; margin: 0 0 14px; color: var(--apagado); }
    .gr-folio {
      display: inline-block; font-size: 16px; font-weight: 800; letter-spacing: 0.04em;
      background: var(--pop); border-radius: 999px;
      padding: 8px 18px; margin: 4px 0 18px;
    }
    .gr-btn {
      display: flex; align-items: center; justify-content: center; width: 100%;
      margin: 10px 0 0; padding: 13px 18px; border-radius: 999px;
      font-size: 15px; font-weight: 700; text-decoration: none; cursor: pointer;
      border: 1px solid var(--linea); color: var(--tinta);
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }
    .gr-btn:active { transform: scale(0.98); }
    .gr-btn.primario { background: var(--tinta); color: var(--fundo); border-color: var(--tinta); }
    .gr-btn.primario:hover { background: #2c2838; }
    .gr-btn.fantasma:hover { background: var(--tinta); color: var(--fundo); }
    .gr-chico { font-size: 13px; color: var(--apagado); margin-top: 18px; }
  </style>
</head>
<body>
  <div class="gr-wrap">
    <div class="gr-card">
      <img src="img/donas.webp" alt="MILO'S 3D" class="gr-logo" onerror="this.style.display='none'">
      <div class="gr-icono" id="gr-icono">🤖</div>
      <h1 id="gr-titulo">Revisando tu pago…</h1>
      <p id="gr-texto">Dame un segundo.</p>
      <div class="gr-folio" id="gr-folio" hidden></div>
      <a class="gr-btn primario" id="gr-wa" href="#">💬 Escribirnos por WhatsApp</a>
      <a class="gr-btn fantasma" href="/">← Volver a la tienda</a>
      <p class="gr-chico" id="gr-nota"></p>
    </div>
  </div>

  <script>
    const par = new URLSearchParams(location.search);
    const pago = par.get("pago") || "exito";
    const folio = (par.get("folio") || "").replace(/[^\w-]/g, "").slice(0, 40);
    const WA = "524427831563";

    const casos = {
      exito: {
        icono: "🎉",
        titulo: "¡Listo, gracias por tu compra!",
        texto: "Ya recibimos tu pago. Nos ponemos a imprimir y te avisamos por WhatsApp en cuanto esté.",
        wa: "¡Hola MILO'S 3D! 🤖 Acabo de pagar mi pedido"
      },
      pendiente: {
        icono: "⏳",
        titulo: "Tu pago está en proceso",
        texto: "Algunos métodos tardan un rato en confirmarse. En cuanto se acredite te escribimos por WhatsApp.",
        wa: "¡Hola MILO'S 3D! 🤖 Pagué mi pedido y quedó en proceso"
      },
      error: {
        icono: "😕",
        titulo: "El pago no se completó",
        texto: "No se te cobró nada. Puedes intentar de nuevo o pedirlo por WhatsApp y lo resolvemos contigo.",
        wa: "¡Hola MILO'S 3D! 🤖 Tuve un problema al pagar mi pedido"
      }
    };

    const c = casos[pago] || casos.exito;
    document.getElementById("gr-icono").textContent = c.icono;
    document.getElementById("gr-titulo").textContent = c.titulo;
    document.getElementById("gr-texto").textContent = c.texto;

    if (folio) {
      const caja = document.getElementById("gr-folio");
      caja.textContent = "Pedido " + folio;
      caja.hidden = false;
      document.getElementById("gr-nota").textContent =
        "Guarda este número por si necesitas referirte a tu pedido.";
    }

    // El mensaje ya lleva el folio: así no tiene que explicarse desde cero.
    const texto = c.wa + (folio ? ` (${folio})` : "") + ".";
    document.getElementById("gr-wa").href =
      `https://wa.me/${WA}?text=${encodeURIComponent(texto)}`;

    // El carrito ya cumplió: si el pago salió bien, se vacía para que
    // no le reaparezca el mismo pedido al volver a la tienda.
    if (pago === "exito") {
      try { localStorage.removeItem("milos3d_cart"); } catch (e) { /* sin guardado, da igual */ }
    }
  </script>
</body>
</html>
