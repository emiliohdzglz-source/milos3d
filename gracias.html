<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gracias por tu compra — MILO'S 3D</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/logo.webp" type="image/webp">
  <style>
    /* Página de una sola cosa: decirle al cliente qué pasó con su pago
       y dejarle un camino claro para hablar con nosotros. */
    .gr-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 28px 20px;
    }
    .gr-card {
      width: 100%; max-width: 460px; text-align: center;
      background: rgba(10, 16, 32, .85); border: 1px solid rgba(76, 201, 255, .22);
      border-radius: 18px; padding: 34px 26px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .5);
    }
    .gr-logo { width: 78px; margin-bottom: 14px; }
    .gr-icono { font-size: 50px; line-height: 1; margin-bottom: 10px; }
    .gr-card h1 { font-family: 'Orbitron', sans-serif; font-size: 23px; margin: 0 0 10px; }
    .gr-card p { font-size: 16px; line-height: 1.5; margin: 0 0 14px; color: #c3cde0; }
    .gr-folio {
      display: inline-block; font-family: 'Orbitron', sans-serif; font-size: 18px;
      background: rgba(76, 201, 255, .1); border: 1px solid rgba(76, 201, 255, .3);
      border-radius: 10px; padding: 9px 16px; margin: 4px 0 18px; letter-spacing: 1px;
    }
    .gr-btn {
      display: block; width: 100%; box-sizing: border-box; margin: 10px 0 0;
      padding: 14px 18px; border-radius: 12px; border: 1px solid rgba(76, 201, 255, .35);
      font-family: 'Rajdhani', sans-serif; font-size: 17px; font-weight: 600;
      text-decoration: none; cursor: pointer;
    }
    .gr-btn.primario { background: linear-gradient(135deg, #4cc9ff, #2d7ff9); color: #041020; border: 0; }
    .gr-btn.fantasma { background: rgba(76, 201, 255, .06); color: #e8eefc; }
    .gr-chico { font-size: 14px; color: #8a97ad; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="gr-wrap">
    <div class="gr-card">
      <img src="assets/logo.webp" alt="MILO'S 3D" class="gr-logo" onerror="this.style.display='none'">
      <div class="gr-icono" id="gr-icono">🤖</div>
      <h1 id="gr-titulo">Revisando tu pago…</h1>
      <p id="gr-texto">Dame un segundo.</p>
      <div class="gr-folio" id="gr-folio" hidden></div>
      <a class="gr-btn primario" id="gr-wa" href="#">💬 Escribirnos por WhatsApp</a>
      <a class="gr-btn fantasma" href="/">← Volver a la tienda</a>
      <p class="gr-chico" id="gr-nota"></p>
    </div>
  </div>

  <script>
    const par = new URLSearchParams(location.search);
    const pago = par.get("pago") || "exito";
    const folio = (par.get("folio") || "").replace(/[^\w-]/g, "").slice(0, 40);
    const WA = "524427831563";

    const casos = {
      exito: {
        icono: "🎉",
        titulo: "¡Listo, gracias por tu compra!",
        texto: "Ya recibimos tu pago. Nos ponemos a imprimir y te avisamos por WhatsApp en cuanto esté.",
        wa: "¡Hola MILO'S 3D! 🤖 Acabo de pagar mi pedido"
      },
      pendiente: {
        icono: "⏳",
        titulo: "Tu pago está en proceso",
        texto: "Algunos métodos tardan un rato en confirmarse. En cuanto se acredite te escribimos por WhatsApp.",
        wa: "¡Hola MILO'S 3D! 🤖 Pagué mi pedido y quedó en proceso"
      },
      error: {
        icono: "😕",
        titulo: "El pago no se completó",
        texto: "No se te cobró nada. Puedes intentar de nuevo o pedirlo por WhatsApp y lo resolvemos contigo.",
        wa: "¡Hola MILO'S 3D! 🤖 Tuve un problema al pagar mi pedido"
      }
    };

    const c = casos[pago] || casos.exito;
    document.getElementById("gr-icono").textContent = c.icono;
    document.getElementById("gr-titulo").textContent = c.titulo;
    document.getElementById("gr-texto").textContent = c.texto;

    if (folio) {
      const caja = document.getElementById("gr-folio");
      caja.textContent = "Pedido " + folio;
      caja.hidden = false;
      document.getElementById("gr-nota").textContent =
        "Guarda este número por si necesitas referirte a tu pedido.";
    }

    // El mensaje ya lleva el folio: así no tiene que explicarse desde cero.
    const texto = c.wa + (folio ? ` (${folio})` : "") + ".";
    document.getElementById("gr-wa").href =
      `https://wa.me/${WA}?text=${encodeURIComponent(texto)}`;

    // El carrito ya cumplió: si el pago salió bien, se vacía para que
    // no le reaparezca el mismo pedido al volver a la tienda.
    if (pago === "exito") {
      try { localStorage.removeItem("milos3d_cart"); } catch (e) { /* sin guardado, da igual */ }
    }
  </script>
</body>
</html>
